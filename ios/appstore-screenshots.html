<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:D;src:local("Inter Display Bold"),local("SF Pro Display Bold");font-weight:700}
@font-face{font-family:D;src:local("Inter Display Medium"),local("SF Pro Display Medium");font-weight:500}
html,body{margin:0;width:440px;height:956px;overflow:hidden;font-family:D;-webkit-font-smoothing:antialiased}
.g{position:absolute;inset:0;background:radial-gradient(70% 45% at 92% 4%,#40d69c 0,rgba(64,214,156,0) 70%),radial-gradient(60% 50% at 0% 100%,#10663b,rgba(16,102,59,0) 70%),linear-gradient(170deg,#0a4a2b,#05281a 60%,#0b5a34)}
.n{position:absolute;inset:0;background:radial-gradient(70% 45% at 92% 4%,#3b4c9a 0,rgba(59,76,154,0) 70%),radial-gradient(60% 50% at 0% 100%,#161e3f,rgba(22,30,63,0) 70%),linear-gradient(170deg,#121a3a,#090c19 60%,#161e3f)}
h1{position:absolute;left:28px;right:28px;top:78px;margin:0;color:#fff;font-weight:700;font-size:36px;line-height:1.08;letter-spacing:-.025em;text-align:center;text-wrap:balance}
.shot{position:absolute;left:50%;top:232px;width:330px;transform:translateX(-50%);border-radius:46px;box-shadow:0 0 0 1.5px rgba(255,255,255,.18),0 30px 70px rgba(0,0,0,.45);overflow:hidden}
.shot img{display:block;width:100%}
.wid{position:absolute;left:24px;right:24px;top:236px;display:flex;flex-direction:column;gap:14px;align-items:center}
.wid img{display:block;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.row{display:flex;gap:14px;align-items:center}
.lock{background:rgba(255,255,255,.08);border-radius:26px;padding:12px;display:flex;gap:12px;align-items:center}
.lock img{box-shadow:none;border-radius:14px}
</style></head><body><div id="bg" class="g"></div><h1 id="t"></h1><div id="c"></div>
<script>
const P='';   // the images from dist/review/phone and dist/review/widgets, copied next to this page
window.show=(k)=>{
 const S={
  1:['g','Close the lid.<br>Your AI keeps working.','m1-home'],
  2:['g','Keep it awake for an hour, or always.','m4-two-hours'],
  3:['g','On your Home Screen and Lock Screen.',null],
  4:['n','It sleeps when the work is done.','m3-asleep'],
  5:['g','Every setting, from anywhere.','m2-settings']}[k];
 document.getElementById('bg').className=S[0];document.getElementById('t').innerHTML=S[1];
 const c=document.getElementById('c');
 if(S[2]) c.innerHTML=`<div class="shot"><img src="${P+S[2]}.png"></div>`;
 else c.innerHTML=`<div class="wid">
   <img src="${P}medium-working.png" style="width:392px">
   <div class="row"><img src="${P}small-waiting.png" style="width:189px"><img src="${P}small-asleep.png" style="width:189px"></div>
   <img src="${P}live-activity.png" style="width:392px;border-radius:26px">
   <div class="lock"><img src="${P}lock-circle-working.png" style="width:86px"><img src="${P}lock-rect-working.png" style="width:196px"></div></div>`;
};
</script></body></html>
